<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="flix-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f43f5e" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background Dark Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="#070b14" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0f172a" stroke="url(#flix-grad)" stroke-width="2" />

  <!-- Play Badge Gradient Background -->
  <circle cx="32" cy="32" r="22" fill="url(#flix-grad)" filter="url(#glow)"/>

  <!-- Play Icon Triangle -->
  <polygon points="27,22 43,32 27,42" fill="#ffffff" />
</svg>
